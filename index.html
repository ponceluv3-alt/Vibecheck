<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval'; connect-src *;">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>vibecheck — find your work vibe</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: #F7F6FF; color: #1A1A2E; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const BRAND="#6C5CE7",CORAL="#E17055",TEAL="#00B894",ROSE="#E84393",INK="#1A1A2E",INK_MID="#4A4A6A",INK_LIGHT="#8888AA",BG="#F7F6FF",BORDER="rgba(108,92,231,0.15)",DANGER="#D63031",AMBER="#FDCB6E";

function btn(v="primary"){return{padding:"10px 22px",borderRadius:24,cursor:"pointer",border:v==="outline"?"1.5px solid "+BRAND:"none",background:v==="primary"?BRAND:"transparent",color:v==="primary"?"#fff":BRAND,fontWeight:600,fontSize:14,display:"inline-flex",alignItems:"center",gap:6};}
function pill(color=BRAND,bg="#F0EEFF"){return{display:"inline-block",padding:"3px 12px",borderRadius:20,background:bg,color,fontSize:12,fontWeight:600};}
function tag(sel){return{padding:"6px 14px",borderRadius:20,cursor:"pointer",border:sel?"1.5px solid "+BRAND:"1px solid "+BORDER,background:sel?"#F0EEFF":BG,color:sel?BRAND:INK_MID,fontSize:13,fontWeight:sel?600:400};}
function navBtn(active){return{padding:"6px 14px",borderRadius:20,border:"none",cursor:"pointer",background:active?"#F0EEFF":"transparent",color:active?BRAND:INK_MID,fontWeight:active?600:400,fontSize:14};}
function scoreCol(s){if(s>=75)return{bg:"#EDFFF5",color:"#16a085"};if(s>=55)return{bg:"#FFF8EE",color:"#e67e22"};return{bg:"#FFF0F0",color:DANGER};}
const card={background:"#fff",border:"1px solid "+BORDER,borderRadius:16,padding:"20px 24px",marginBottom:12};
const lbl={fontSize:11,fontWeight:600,letterSpacing:"0.08em",textTransform:"uppercase",color:INK_LIGHT,marginBottom:8,display:"block"};
const inp={width:"100%",padding:"10px 14px",borderRadius:10,border:"1.5px solid "+BORDER,fontSize:14,color:INK,background:"#fff",outline:"none",boxSizing:"border-box"};

const QUESTIONS=[
  {dim:"risk",scene:"It's Monday morning. Your manager drops a vague message: 'we need to rethink the whole approach.' You...",choices:[{t:"get excited",s:"finally, something new",v:5},{t:"ask for more context",s:"need to know the scope",v:3},{t:"wait to see what develops",s:"no need to react yet",v:2},{t:"feel a bit stressed",s:"just got comfortable",v:1}]},
  {dim:"autonomy",scene:"You finish a project early. Nobody tells you what's next. You...",choices:[{t:"find the next thing yourself",s:"don't need to be told",v:5},{t:"check in with your manager",s:"make sure you're aligned",v:3},{t:"see how you can help the team",s:"collaboration first",v:3},{t:"take a breather",s:"you earned it",v:2}]},
  {dim:"collab",scene:"A teammate keeps doing things differently than you'd do them. The outcome is fine, but it bugs you. You...",choices:[{t:"mention it directly",s:"you're curious about their approach",v:4},{t:"observe a bit longer",s:"outcomes matter more than method",v:3},{t:"let them do their thing",s:"different is fine",v:5},{t:"bring it up in a retro",s:"not worth a 1:1",v:2}]},
  {dim:"values",scene:"Your dream role just posted — but it's a meaningful pay cut. You...",choices:[{t:"apply immediately",s:"money isn't everything",v:5},{t:"run the numbers carefully",s:"passion needs a budget",v:3},{t:"negotiate hard before deciding",s:"worth asking",v:3},{t:"pass on it",s:"you've got bills",v:1}]},
  {dim:"drive",scene:"You're asked to present your team's work to senior leadership next week. You...",choices:[{t:"jump at it",s:"visibility matters",v:5},{t:"prep thoroughly and go for it",s:"confident when ready",v:4},{t:"suggest a teammate instead",s:"they'd do it better",v:2},{t:"agree but feel anxious",s:"not your comfort zone",v:1}]},
  {dim:"autonomy",scene:"Your company goes all-remote. No office, no set hours, just deliver results. You feel...",choices:[{t:"genuinely thrilled",s:"this is how you work best",v:5},{t:"mostly good, need structure",s:"you'll build your own routine",v:4},{t:"fine, but you'll miss the energy",s:"collaboration takes a hit",v:2},{t:"not that into it",s:"you like a real office",v:1}]},
  {dim:"risk",scene:"A decision needs to be made and there's no clear right answer. You...",choices:[{t:"make the call and own it",s:"someone has to decide",v:5},{t:"gather more data first",s:"reduce the uncertainty",v:3},{t:"propose a small experiment",s:"test before committing",v:4},{t:"try to find consensus",s:"buy-in matters more",v:2}]},
  {dim:"comm",scene:"A coworker sends you a blunt message that kind of stings. You think they meant well. You...",choices:[{t:"address it right away",s:"you'd want to know if it was you",v:5},{t:"let it sit, then respond",s:"less reactive that way",v:3},{t:"assume good intent, move on",s:"not worth the energy",v:2},{t:"joke to break the tension",s:"you're not that sensitive",v:3}]},
  {dim:"adapt",scene:"Your company pivots to a totally new market. Your role changes significantly. You...",choices:[{t:"see it as a new chapter",s:"exciting, honestly",v:5},{t:"take time to adjust, then adapt",s:"you'll get there",v:4},{t:"have a lot of questions first",s:"need to understand the why",v:3},{t:"start looking around",s:"this isn't what you signed up for",v:1}]},
  {dim:"collab",scene:"First week at a new job. Onboarding is basically 'figure it out.' You...",choices:[{t:"immediately start meeting people",s:"relationships first",v:5},{t:"read every doc you can find",s:"context before action",v:4},{t:"observe quietly before engaging",s:"you like to read the room",v:3},{t:"ask for a clearer plan",s:"sink or swim isn't your vibe",v:1}]},
  {dim:"drive",scene:"You've been in the same role for 18 months. Things are comfortable. You feel...",choices:[{t:"itchy to level up",s:"you've already outgrown it",v:5},{t:"ready when the timing is right",s:"deliberate, not complacent",v:4},{t:"still growing here",s:"depth before breadth",v:3},{t:"honestly pretty content",s:"stability is underrated",v:1}]},
  {dim:"values",scene:"Your employer asks you to work on a project you find ethically questionable. The pay is great. You...",choices:[{t:"decline without hesitation",s:"some lines you just don't cross",v:5},{t:"raise your concerns first",s:"might be a misunderstanding",v:4},{t:"weigh it carefully",s:"context matters",v:2},{t:"do it",s:"it's just work",v:1}]},
  {dim:"comm",scene:"You disagree with a decision your manager just made in front of the team. You...",choices:[{t:"say so in the moment",s:"transparency over comfort",v:5},{t:"bring it up 1:1 afterward",s:"pick your battles and timing",v:4},{t:"document your concerns",s:"cover yourself, at least",v:2},{t:"go along with it",s:"they have more context",v:1}]},
  {dim:"adapt",scene:"You're handed a tool or process you've never used. No training, just a deadline. You...",choices:[{t:"dive in and figure it out",s:"best way to learn",v:5},{t:"find a tutorial fast",s:"smart, not stubborn",v:4},{t:"find someone who knows it",s:"why reinvent the wheel",v:3},{t:"flag the risk to your manager",s:"deadlines need reality checks",v:2}]},
  {dim:"risk",scene:"You have a stable job and a wild idea that could work — or completely flop. You...",choices:[{t:"start building on the side",s:"optionality is everything",v:5},{t:"research it obsessively first",s:"validate before you leap",v:4},{t:"pitch it to your company",s:"let them fund the risk",v:3},{t:"stay put for now",s:"it's probably not the right time",v:1}]},
];

const ARCHETYPES=[
  {id:"builder",name:"the builder",tag:"high drive + risk tolerance",color:CORAL,bg:"#FFF0ED",desc:"You move fast, make calls with incomplete info, and light up when things are messy. Startups, new ventures, and zero-to-one work were made for you.",traits:["action-oriented","self-starter","big picture"],thrive:["startup or early-stage","ownership over outcomes","fast feedback loops"],watch:["burnout from always being on","skipping important details"],roles:["founder","product lead","biz dev","growth role"]},
  {id:"connector",name:"the connector",tag:"high collab + values-driven",color:TEAL,bg:"#EDFFF9",desc:"You make teams better just by being in them. Culture and relationships are the actual work. People follow you because they trust you.",traits:["emotionally intelligent","mission-driven","great listener"],thrive:["strong team culture","mission-aligned company","psychological safety"],watch:["conflict avoidance","over-investing in others"],roles:["people ops","team lead","community manager","customer success"]},
  {id:"architect",name:"the architect",tag:"high autonomy + systems thinking",color:BRAND,bg:"#F0EEFF",desc:"You figure things out. Ambiguity helps you do your best work. You build systems that outlast you and prefer depth over visibility.",traits:["independent","systems thinker","methodical"],thrive:["remote or async work","high-autonomy roles","complex problems"],watch:["isolation if not intentional","overcomplicating things"],roles:["engineer","ops or strategy","technical lead","researcher"]},
  {id:"driver",name:"the driver",tag:"high drive + direct communicator",color:"#d35400",bg:"#FFF5EE",desc:"You push for results and say what you mean. You need clear goals, real feedback, and a team that keeps up.",traits:["direct communicator","results-focused","decisive"],thrive:["performance culture","clear metrics","candid feedback"],watch:["coming across as blunt","steamrolling quieter teammates"],roles:["sales lead","GM or director","recruiting","revenue ops"]},
  {id:"anchor",name:"the anchor",tag:"stable + values-led",color:"#27ae60",bg:"#EDFFF5",desc:"You're the calm in the chaos. You build things that last and keep people grounded when everything feels on fire.",traits:["reliable","values-led","trustworthy"],thrive:["stable purpose-driven orgs","steady growth","mentorship culture"],watch:["resistance to rapid change","not self-promoting enough"],roles:["ops manager","project manager","department lead","finance"]},
  {id:"catalyst",name:"the catalyst",tag:"high energy + high comm",color:ROSE,bg:"#FFF0F8",desc:"You energize rooms. Ideas come fast, you sell them well, and you thrive at the center of what's happening.",traits:["high energy","persuasive","idea-generator"],thrive:["client-facing work","brainstorming culture","visible roles"],watch:["following through on own ideas","mistaking activity for progress"],roles:["marketing lead","BD or partnerships","founder","account exec"]},
  {id:"specialist",name:"the specialist",tag:"deep focus + low risk",color:"#2980b9",bg:"#EEF6FF",desc:"You go deep, not wide. You're at your best with a specific problem and the freedom to go all in.",traits:["deep focus","craft-oriented","detail-driven"],thrive:["subject matter ownership","clear scope","quality-over-speed"],watch:["narrow perspective on cross-functional decisions"],roles:["engineer","data scientist","designer","technical writer"]},
  {id:"scout",name:"the scout",tag:"curious + high adaptability",color:"#e67e22",bg:"#FFF8EE",desc:"You're always looking around the corner. You pick things up faster than most and get restless when you stop learning.",traits:["endlessly curious","fast learner","pattern-spotter"],thrive:["rapidly evolving industries","new problems regularly"],watch:["spreading yourself too thin","finishing what you started"],roles:["product manager","consultant","strategy","early-stage generalist"]},
  {id:"guardian",name:"the guardian",tag:"process-driven + high values",color:"#16a085",bg:"#EDFAF7",desc:"You protect the standards. You make sure things are done right, not just done fast.",traits:["principled","process-oriented","integrity-first"],thrive:["clear standards","ethics-forward company","steady pace"],watch:["being seen as a blocker","friction with move-fast cultures"],roles:["compliance","quality assurance","finance","operations"]},
  {id:"empath",name:"the empath",tag:"people-first + mission-driven",color:"#8e44ad",bg:"#F9F0FF",desc:"You feel the room before anyone else does. You're drawn to work that matters to people.",traits:["highly perceptive","caring","natural coach"],thrive:["human-centered work","meaningful mission","space to build trust"],watch:["absorbing other people's stress","under-advocating for yourself"],roles:["coach","nonprofit","HR / people ops","teacher"]},
];

function getArch(n){
  if(n.drive>0.7&&n.risk>0.7)return ARCHETYPES[0];
  if(n.collab>0.7&&n.values>0.65)return ARCHETYPES[1];
  if(n.autonomy>0.7&&n.risk<0.4)return ARCHETYPES[2];
  if(n.drive>0.65&&n.comm>0.7)return ARCHETYPES[3];
  if(n.risk<0.4&&n.values>0.65)return ARCHETYPES[4];
  if(n.comm>0.7&&n.drive>0.6)return ARCHETYPES[5];
  if(n.risk<0.4&&n.autonomy>0.6)return ARCHETYPES[6];
  if(n.adapt>0.7&&n.risk>0.55)return ARCHETYPES[7];
  if(n.values>0.7&&n.risk<0.45)return ARCHETYPES[8];
  if(n.collab>0.65&&n.values>0.7)return ARCHETYPES[9];
  return ARCHETYPES[4];
}

function computeScores(answers){
  const sums={},counts={};
  QUESTIONS.forEach((q,i)=>{
    if(answers[i]!=null){sums[q.dim]=(sums[q.dim]||0)+q.choices[answers[i]].v;counts[q.dim]=(counts[q.dim]||0)+1;}
  });
  const norm={};
  Object.keys(sums).forEach(k=>norm[k]=counts[k]?sums[k]/(counts[k]*5):0.5);
  return norm;
}

async function fetchNarrative(arch,norm,apiKey){
  const dims=Object.entries(norm).map(([k,v])=>k+": "+Math.round(v*100)+"/100").join(", ");
  const prompt='You are writing a personalized work-style narrative for someone who just completed a culture index quiz. Their archetype is "'+arch.name+'" ('+arch.tag+'). Their dimension scores: '+dims+'. Write 2 short sentences (no headers, no bullets) that feel personal, warm, and direct. Second person. Under 80 words total. Be concise.';
  const res=await fetch("/api/generate",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01"},
    body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:1000,messages:[{role:"user",content:prompt}]}),
  });
  const data=await res.json();
  return data.content&&data.content[0]?data.content[0].text:"error: "+JSON.stringify(data);
}

function DimBars({norm,color}){
  return React.createElement("div",null,
    ["drive","risk","collab","autonomy","comm","values","adapt"].map(d=>{
      const val=Math.round((norm[d]||0.5)*100);
      return React.createElement("div",{key:d,style:{display:"flex",alignItems:"center",gap:10,marginBottom:8}},
        React.createElement("span",{style:{fontSize:12,color:INK_MID,width:72}},d),
        React.createElement("div",{style:{flex:1,height:6,background:BORDER,borderRadius:3}},
          React.createElement("div",{style:{height:6,borderRadius:3,background:color,width:val+"%"}})),
        React.createElement("span",{style:{fontSize:12,fontWeight:600,minWidth:28}},val)
      );
    })
  );
}

function KeyInput({onSave}){
  const [k,setK]=useState("");
  return (
    <div style={{maxWidth:480,margin:"60px auto",padding:"0 20px"}}>
      <div style={card}>
        <div style={{textAlign:"center",marginBottom:20}}>
          <div style={{fontSize:36,marginBottom:8}}>🔑</div>
          <h2 style={{fontSize:20,fontWeight:700,margin:"0 0 8px"}}>enter your API key</h2>
          <p style={{fontSize:13,color:INK_MID,margin:0}}>Paste your Anthropic API key to enable AI features. It stays in your browser only.</p>
        </div>
        <input style={{...inp,marginBottom:12}} type="password" placeholder="sk-ant-api03-..." value={k} onChange={e=>setK(e.target.value)}/>
        <button style={{...btn("primary"),width:"100%",justifyContent:"center",opacity:k.trim()?1:0.4}} disabled={!k.trim()} onClick={()=>onSave(k.trim())}>save &amp; continue →</button>
      </div>
    </div>
  );
}

function Quiz({onDone}){
  const [cur,setCur]=useState(0);
  const [answers,setAnswers]=useState(new Array(QUESTIONS.length).fill(null));
  const q=QUESTIONS[cur];
  const pct=Math.round(((cur+1)/QUESTIONS.length)*100);
  function pick(ci){const next=[...answers];next[cur]=ci;setAnswers(next);}
  function next(){
    if(cur<QUESTIONS.length-1){setCur(cur+1);}
    else{const norm=computeScores(answers);onDone(norm,getArch(norm));}
  }
  return (
    <div style={{maxWidth:720,margin:"0 auto",padding:"32px 20px"}}>
      <div style={{marginBottom:24}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
          <span style={{fontSize:13,color:INK_LIGHT}}>scenario {cur+1} of {QUESTIONS.length}</span>
          <span style={{fontSize:13,color:BRAND,fontWeight:600}}>{pct}%</span>
        </div>
        <div style={{height:4,background:BORDER,borderRadius:2}}>
          <div style={{height:4,background:BRAND,borderRadius:2,width:pct+"%"}}/>
        </div>
      </div>
      <div style={{...card,marginBottom:16}}>
        <div style={lbl}>scenario {cur+1}</div>
        <p style={{fontSize:17,fontWeight:500,lineHeight:1.6,margin:0}}>{q.scene}</p>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:20}}>
        {q.choices.map((c,ci)=>{
          const sel=answers[cur]===ci;
          return (
            <button key={ci} onClick={()=>pick(ci)} style={{background:sel?"#F0EEFF":"#fff",border:sel?"2px solid "+BRAND:"1px solid "+BORDER,borderRadius:14,padding:"14px 16px",textAlign:"left",cursor:"pointer"}}>
              <div style={{fontSize:14,fontWeight:600,color:sel?BRAND:INK,marginBottom:4}}>{c.t}</div>
              <div style={{fontSize:12,color:sel?BRAND:INK_LIGHT}}>{c.s}</div>
            </button>
          );
        })}
      </div>
      <div style={{display:"flex",justifyContent:"space-between"}}>
        <button style={btn("outline")} onClick={()=>setCur(Math.max(0,cur-1))} disabled={cur===0}>← back</button>
        <button style={{...btn("primary"),opacity:answers[cur]==null?0.4:1}} onClick={next} disabled={answers[cur]==null}>
          {cur===QUESTIONS.length-1?"see my vibe →":"next →"}
        </button>
      </div>
    </div>
  );
}

function Profile({arch,norm,apiKey}){
  const [name,setName]=useState("");
  const [nameSet,setNameSet]=useState(false);
  const [narrative,setNarrative]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [dots,setDots]=useState(".");

  useEffect(()=>{
    if(!nameSet)return;
    setLoading(true);
   fetchNarrative(arch,norm,apiKey)
  .then(t=>{setNarrative(t);setLoading(false);})
  .catch((e)=>{setError("Error: "+e.message);setLoading(false);});
},[nameSet]);

  useEffect(()=>{
    if(!loading)return;
    const t=setInterval(()=>setDots(d=>d.length>=3?".":d+"."),400);
    return()=>clearInterval(t);
  },[loading]);

  if(!nameSet){
    return (
      <div style={{maxWidth:480,margin:"60px auto",padding:"0 20px"}}>
        <div style={card}>
          <div style={{textAlign:"center",marginBottom:24}}>
            <div style={{fontSize:36,marginBottom:8}}>✦</div>
            <h2 style={{fontSize:22,fontWeight:700,margin:"0 0 8px"}}>personalize your profile</h2>
            <p style={{fontSize:14,color:INK_MID,margin:0}}>Claude will write a custom narrative just for you. What should we call you?</p>
          </div>
          <input style={{...inp,marginBottom:12}} placeholder="your name or nickname" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&name.trim()&&setNameSet(true)}/>
          <button style={{...btn("primary"),width:"100%",justifyContent:"center",opacity:name.trim()?1:0.4}} disabled={!name.trim()} onClick={()=>setNameSet(true)}>
            ✦ generate my AI profile →
          </button>
        </div>
      </div>
    );
  }

  return (
    <div style={{maxWidth:720,margin:"0 auto",padding:"32px 20px"}}>
      <div style={{...card,background:arch.bg,border:"1px solid "+arch.color+"30",marginBottom:12}}>
        <div style={{marginBottom:10}}><span style={pill(arch.color,"rgba(255,255,255,0.6)")}>{arch.tag}</span></div>
        <h2 style={{fontSize:32,fontWeight:800,margin:"0 0 6px",letterSpacing:"-0.5px"}}>{name?" "+name+" is "+arch.name:arch.name}</h2>
        <p style={{fontSize:15,color:INK_MID,margin:0,maxWidth:480,lineHeight:1.6}}>{arch.desc}</p>
      </div>

      <div style={card}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
          <span style={pill(BRAND,"#F0EEFF")}>✦ AI narrative</span>
          <span style={{fontSize:12,color:INK_LIGHT}}>written by Claude</span>
        </div>
        {loading&&(
          <div style={{textAlign:"center",padding:"32px 0"}}>
            <div style={{fontSize:32,marginBottom:12}}>✦</div>
            <div style={{fontSize:15,color:BRAND,fontWeight:600}}>Claude is writing your narrative{dots}</div>
          </div>
        )}
        {error&&<div style={{color:DANGER,fontSize:14}}>{error}</div>}
        {narrative&&narrative.split("\n\n").map((p,i)=><p key={i} style={{fontSize:15,lineHeight:1.8,margin:"0 0 16px"}}>{p}</p>)}
      </div>

      <div style={card}>
        <div style={lbl}>dimension scores</div>
        <DimBars norm={norm} color={arch.color}/>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div style={card}>
          <div style={lbl}>you thrive when...</div>
          {arch.thrive.map((t,i)=><div key={i} style={{fontSize:13,color:INK_MID,padding:"5px 0",borderBottom:i<arch.thrive.length-1?"1px solid "+BORDER:"none"}}>✓ {t}</div>)}
        </div>
        <div style={card}>
          <div style={lbl}>growth edges</div>
          {arch.watch.map((t,i)=><div key={i} style={{fontSize:13,color:INK_MID,padding:"5px 0",borderBottom:i<arch.watch.length-1?"1px solid "+BORDER:"none"}}>→ {t}</div>)}
        </div>
      </div>
    </div>
  );
}

function Home({setPage}){
  return (
    <div style={{maxWidth:720,margin:"0 auto",padding:"32px 20px"}}>
      <div style={{textAlign:"center",padding:"48px 0 40px"}}>
        <div style={{fontSize:48,marginBottom:16}}>⚡</div>
        <h1 style={{fontSize:40,fontWeight:800,margin:"0 0 16px",letterSpacing:"-1px"}}>find your work vibe</h1>
        <p style={{fontSize:18,color:INK_MID,maxWidth:480,margin:"0 auto 32px",lineHeight:1.6}}>15 real scenarios. 10 archetypes. one match score that actually means something.</p>
        <div style={{display:"flex",gap:12,justifyContent:"center"}}>
          <button style={btn("primary")} onClick={()=>setPage("quiz")}>take the vibe check →</button>
          <button style={btn("outline")} onClick={()=>setPage("employer")}>i'm hiring</button>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:12}}>
        {[{icon:"🎯",t:"culture matching",d:"7 dimensions that predict real fit"},{icon:"🧬",t:"10 archetypes",d:"personality-first profiles worth sharing"},{icon:"🤝",t:"b2b recruiting",d:"post roles and score candidates"},{icon:"✦",t:"AI-powered",d:"Claude writes your personal narrative"}].map(f=>(
          <div key={f.t} style={card}>
            <div style={{fontSize:28,marginBottom:10}}>{f.icon}</div>

          </div>
        ))}

}

function App(){
  const [page,setPage]=useState("home");
  const [norm,setNorm]=useState(null);
  const [arch,setArch]=useState(null);
  const [apiKey,setApiKey]=useState(localStorage.getItem("vck")||"");
  const [showKey,setShowKey]=useState(!localStorage.getItem("vck"));

  function saveKey(k){setApiKey(k);localStorage.setItem("vck",k);setShowKey(false);}
  function onQuizDone(n,a){setNorm(n);setArch(a);setPage("profile");}

  const navItems=[{id:"home",label:"home"},{id:"quiz",label:"vibe check"},...(norm?[{id:"profile",label:"my profile"}]:[]),{id:"employer",label:"for employers"}];

  if(showKey) return React.createElement("div",{style:{fontFamily:"'DM Sans',sans-serif",background:BG,minHeight:"100vh",color:INK}},
    React.createElement(KeyInput,{onSave:saveKey})
  );

  return (
    <div style={{fontFamily:"'DM Sans',sans-serif",background:BG,minHeight:"100vh",color:INK}}>
      <nav style={{background:"#fff",borderBottom:"1px solid "+BORDER,padding:"0 24px",display:"flex",alignItems:"center",justifyContent:"space-between",height:56,position:"sticky",top:0,zIndex:100}}>
        <div style={{fontWeight:700,fontSize:18,color:BRAND}}>⚡ vibecheck</div>
        <div style={{display:"flex",gap:4}}>
          {navItems.map(i=><button key={i.id} style={navBtn(page===i.id)} onClick={()=>setPage(i.id)}>{i.label}</button>)}
          <button style={{...navBtn(false),fontSize:12,opacity:0.5}} onClick={()=>setShowKey(true)}>🔑</button>
        </div>
      </nav>
      {page==="home"&&<Home setPage={setPage}/>}
      {page==="quiz"&&<Quiz onDone={onQuizDone}/>}
      {page==="profile"&&norm&&arch&&<Profile arch={arch} norm={norm} apiKey={apiKey}/>}
      {page==="employer"&&<div style={{maxWidth:720,margin:"0 auto",padding:"32px 20px"}}><div style={card}><h2 style={{fontSize:22,fontWeight:700,margin:"0 0 8px"}}>employer portal coming soon!</h2><p style={{color:INK_MID}}>The B2B features are ready — we'll add them here next.</p></div></div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
